[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lalux-paperless-sync"
version = "0.1.0"
description = "Copy your documents from LALUX easyAPP into Paperless-ngx"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.scripts]
lalux-paperless-sync = "lalux_paperless_sync.__main__:main"
